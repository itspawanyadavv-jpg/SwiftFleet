server:
  port: ${PORT:8085}

spring:
  application:
    name: swiftfleet-backend
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
      timeout: 5000ms
      connect-timeout: 5000ms

swiftfleet:
  store-name: ${STORE_NAME:SwiftFleet Hub — Indirapuram}
  store-lat: ${STORE_LAT:28.646705}
  store-lng: ${STORE_LNG:77.444478}
  dispatch-radius-km: ${STORE_RADIUS_KM:3.0}
  drc-store-api-url: ${DRC_STORE_API_URL:}
  store-mode: ${FLEET_STORE_MODE:auto}
  order-lock-ttl-seconds: ${ORDER_LOCK_TTL_SECONDS:30}
  delivery-geofence-meters: ${DELIVERY_GEOFENCE_METERS:150}
  otp-max-attempts: ${OTP_MAX_ATTEMPTS:5}
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3005,http://localhost:3000}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html

